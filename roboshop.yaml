- name: "Create and Delete Ec2 Instances and update R53 Records"
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "mysql", "redis", "rabbitmq"]
    ami_id: "ami-0055977a6e828a4f4"
    domain: "nikhil92s.store"
    action: "create" 
  tasks:
  - name: "Create Ec2 Instances"
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      image_id: "{{ami_id}}"
      instance_type: t3.micro
      security_groups: 
      - roboshop-common
      - "roboshop-{{item}}"
      region: "us-east-1"
    loop: "{{instances}}"
    when: action == "create"
    register: "ec2-output"