- name: "Create and Delete Ec2 Instances and update R53 Records"
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "mysql", "redis", "rabbitmq"]
    ami_id: "ami-0055977a6e828a4f4"
    domain: "nikhil92s.store"
    action: "create" 
  tasks:
  - name: "Create Ec2 Instances"
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      image_id: "{{ami_id}}"
      instance_type: t3.micro
      security_groups: 
      - roboshop-common
      - "roboshop-{{item}}"
      region: "us-east-1"
    loop: "{{instances}}"
    when: action == "create"
    register: ec2_output
  
  # - name: "Print ec2_output"
  #   debug:
  #     msg: "{{ec2_output}}"
  - name: "Create or Update r53 records"
    amazon.aws.route53:
      state: present
      zone: "{{domain}}"
      record: "{{item.item}}.{{domain}}"
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: action == "create"
  
  - name: "Delete R53 Records"
    amazon.aws.route53:
      state: absent
      zone: "{{domain}}"
      record: "{{item}}.{domain}"
      ttl: 1
      type: A
    loop: "{{instances}}"
    when: action == "delete"

  - name: "Delete Ec2 instances"
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{item}}"
      region: us-east-1
      wait: false
    loop: "{{instances}}"
    when: action == "delete"