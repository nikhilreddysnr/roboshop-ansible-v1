- name: Configure Catalogue Application
  hosts: catalogue
  become: true
  tasks:
  - name: Disable Nodejs default
    command: dnf module disable nodejs -y
  
  - name: Enable Nodejs 24
    command: dnf module enable nodejs:24 -y
  
  - name: Install nodejs
    dnf:
      name:
      - nodejs
      state: present
  
  - name: Create a user
    user:
      name: roboshop
      system: true
      create_home: false
      home: /app
      comment: roboshop system user
      shell: /sbin/nologin
      state : present

  - name: remove directory if exists
    file:
      path: /app
      state: absent
  
  - name: remove Catalogue.zip
    file:
      path: /tmp/catalogue.zip
      state: absent

  - name: Create a directory
    file:
      path: /app
      state: directory

  
  
  - name: Downloading Application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip
  
  - name: Unarchive catalogue.zip
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  
  - name: NPM Install dependencies
    community.general.npm:
      path: /app

  - name: Copy Catalogue service
    copy: 
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service
  
  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client
    dnf:
      name: mongodb-mongosh
      state: present
  
  - name: check products loaded or not
    command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
    register: product_count

  - name: print product_count
    debug:
      msg: "{{ product_count }}"

  - name: load the products
    shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
    when: product_count.stdout | int == 0

  - name: daemon reload
    systemd_service:
      daemon_reload: true

  - name: start and enable catalogue
    service:
      name: catalogue
      state: restarted
      enabled: yes