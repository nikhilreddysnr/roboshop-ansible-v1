- name: Configure user Application
  hosts: user
  become: true
  tasks:
  - name: Disable Nodejs default
    command: dnf module disable nodejs -y
  
  - name: Enable Nodejs 24
    command: dnf module enable nodejs:24 -y
  
  - name: Install nodejs
    dnf:
      name:
      - nodejs
      state: present
  
  - name: Create a user
    user:
      name: roboshop
      system: true
      create_home: false
      home: /app
      comment: roboshop system user
      shell: /sbin/nologin
      state : present

  - name: remove directory if exists
    file:
      path: /app
      state: absent
  
  - name: remove user.zip
    file:
      path: /tmp/user.zip
      state: absent

  - name: Create a directory
    file:
      path: /app
      state: directory

  
  
  - name: Downloading Application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
      dest: /tmp/user.zip
  
  - name: Unarchive user.zip
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes
  
  - name: NPM Install dependencies
    community.general.npm:
      path: /app

  - name: Copy user service
    template: 
      src: user.service.j2
      dest: /etc/systemd/system/user.service
  
  

  - name: daemon reload
    systemd_service:
      daemon_reload: true

  - name: start and enable user
    service:
      name: user
      state: restarted
      enabled: yes